<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Frases</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="quote-container" aria-labelledby="quote-title">
            <p class="quote-text" aria-live="polite">
                <i class="fas fa-quote-left" aria-hidden="true"></i>
                <span id="quote">Loading quote...</span>
            </p>

            <div class="button-container">
                <button id="new-quote-btn" class="btn" type="button" aria-label="Gerar uma nova frase">New Quote</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
